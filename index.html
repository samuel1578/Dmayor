<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/FAVICON.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!--
      PRODUCTION DOMAIN — single source for absolute share URLs.
      Replace YOUR-DOMAIN.example in every absolute URL below (canonical, og:url, og:image, twitter:image).
      Do not invent a domain; set this once when the live domain is known.
      Absolute OG image path (after domain): /og-image.png  →  https://YOUR-DOMAIN.example/og-image.png
    -->
    <title>The Proxy Shop</title>
    <meta
      name="description"
      content="Curated menswear for everyday confidence — shirts, trousers, hoodies and shoes selected to work together and wear well."
    />
    <link rel="canonical" href="https://YOUR-DOMAIN.example/" />

    <!-- Open Graph -->
    <meta property="og:title" content="The Proxy Shop" />
    <meta
      property="og:description"
      content="Curated menswear for everyday confidence — shirts, trousers, hoodies and shoes selected to work together and wear well."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://YOUR-DOMAIN.example/" />
    <meta property="og:image" content="https://YOUR-DOMAIN.example/og-image.png" />
    <meta
      property="og:image:alt"
      content="The Proxy Shop — curated menswear preview"
    />
    <meta property="og:site_name" content="The Proxy Shop" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The Proxy Shop" />
    <meta
      name="twitter:description"
      content="Curated menswear for everyday confidence — shirts, trousers, hoodies and shoes selected to work together and wear well."
    />
    <meta
      name="twitter:image"
      content="https://YOUR-DOMAIN.example/og-image.png"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
